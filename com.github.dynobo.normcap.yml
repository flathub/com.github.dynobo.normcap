app-id: com.github.dynobo.normcap
runtime: org.kde.Platform
runtime-version: "6.9"
sdk: org.kde.Sdk
command: normcap
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=TESSDATA_PREFIX=/app/share
  - --filesystem=xdg-pictures # Portal saves screenshots here
  - --talk-name=org.gnome.Shell.* # Window call extension
  - --talk-name=org.kde.StatusNotifierWatcher # KDE system tray
  - --talk-name=org.kde.KWin.* # Window positioning on KDE
cleanup:
  - /sbin
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /bin/protoc
  - /share/bash-completion
  - /share/doc
  - /share/pkgconfig
  - /share/man
  - /share/zsh
  - /share/cmake*
  - "*.a"
  - "*.la"

modules:
  - name: kerberos
    buildsystem: autotools
    subdir: src
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.1.tar.gz
        sha256: 1a8832b8cad923ebbf1394f67e2efcf41e3a49f460285a66e35adec8fa0053af

  # Dependency of tesseract
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz
        sha256: 3745ae3bf271a6801a2292eead83ac926e3a9bc1bf622e9cd4dd0f3786e17205

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.1.zip
        sha256: 291f4808d347410641d2b0d895ae424a45011e37c295067ee749648a2f58fef6

  - name: tessdata-fast
    buildsystem: simple
    build-commands:
      - cp * /app/share/tessdata
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2

  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/v2.2.1/wl-clipboard-2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb
        x-checker-data:
          type: anitya
          project-id: 49082
          stable-only: true
          url-template: https://github.com/bugaevc/wl-clipboard/archive/v$version/wl-clipboard-$version.tar.gz

  - python3-dependencies.json

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 bundle/flatpak/com.github.dynobo.normcap.svg
        /app/share/icons/hicolor/scalable/apps/com.github.dynobo.normcap.svg
      - install -Dm644 bundle/flatpak/com.github.dynobo.normcap.desktop
        /app/share/applications/com.github.dynobo.normcap.desktop
      - install -Dm644 bundle/flatpak/com.github.dynobo.normcap.appdata.xml
        /app/share/appdata/com.github.dynobo.normcap.appdata.xml
      - install -Dm644 bundle/flatpak/com.github.dynobo.normcap.service
        /app/share/dbus-1/services/com.github.dynobo.normcap.service
    sources:
      - type: git
        url: https://github.com/dynobo/normcap.git
        commit: 0d7b7f110215aa435932457388ccd0435ae23993